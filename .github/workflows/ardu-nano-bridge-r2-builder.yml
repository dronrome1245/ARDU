name: ARDU Nano Bridge R2 One Shot

on:
  push:
    paths:
      - ".github/ardu-nano-bridge-r2.trigger"

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch ESP bridge and docs
        run: python3 .github/ardu-nano-bridge-r2-builder.py

      - name: Verify R2 source contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('05_WiFi_и_приложение/esp8266_nano_remote_v4/esp8266_nano_remote_v4.ino').read_text()
          for needle in [
            'ARDU_ESP_V4_NANO_REMOTE_R2',
            'writeNanoProgramTcpAll',
            'writeNanoProgramSerialAll',
            'nanoProgramClient.availableForWrite()',
            'Serial.availableForWrite()',
            'Serial.read(buf, static_cast<size_t>(available))',
            'NANO_PROGRAM_UART_RX_BUFFER = 512',
            'NANO_PROGRAM_IO_STALL_MS = 5000UL',
          ]:
            assert needle in s, needle
          assert 'nanoProgramClient.write(buf, static_cast<size_t>(got));' not in s
          assert 'Serial.write(buf, static_cast<size_t>(got));' not in s
          print('PASS: lossless bridge static contract')
          PY

      - name: Parse PowerShell helper
        shell: pwsh
        run: |
          $source = Get-Content -Raw "tools/flash_nano_over_wifi.ps1"
          [scriptblock]::Create($source) | Out-Null
          if ($source -cmatch '"-V"') { throw "AVRDUDE verify must remain enabled" }
          Write-Host "PASS: helper keeps AVRDUDE verify enabled"

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266

      - name: Prepare configured ESP V4 R2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          source=Path('05_WiFi_и_приложение/esp8266_nano_remote_v4/esp8266_nano_remote_v4.ino').read_text()
          for key,value in {
            'ARDU_WIFI_SSID':'CI_HOME_WIFI',
            'ARDU_WIFI_PASSWORD':'CI_HOME_PASSWORD',
            'ARDU_OTA_PASSWORD':'CI_OTA_PASSWORD',
            'ARDU_SOFTAP_PASSWORD':'CI_DIRECT_PASSWORD',
          }.items():
            pat=rf'(?m)^(#define\s+{key}\s+)"PUT_[A-Z_]+_HERE"$'
            source,n=re.subn(pat,lambda m:m[1]+'"'+value+'"',source)
            assert n==1,key
          out=Path(os.environ['RUNNER_TEMP'])/'esp8266_nano_remote_v4'
          out.mkdir(parents=True,exist_ok=True)
          (out/'esp8266_nano_remote_v4.ino').write_text(source)
          PY

      - name: Compile ESP V4 R2
        run: |
          arduino-cli compile \
            --fqbn esp8266:esp8266:generic \
            --warnings default \
            --build-path "$RUNNER_TEMP/build-esp-v4-r2" \
            "$RUNNER_TEMP/esp8266_nano_remote_v4"

      - name: Remove one-shot builder files
        run: |
          rm -f .github/ardu-nano-bridge-r2-builder.py
          rm -f .github/ardu-nano-bridge-r2.trigger
          rm -f .github/workflows/ardu-nano-bridge-r2-builder.yml

      - name: Commit verified R2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make Nano Wi-Fi verify bridge lossless"
          git push origin HEAD:main
