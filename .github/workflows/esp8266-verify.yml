name: ESP8266 Verify

on:
  push:
    paths:
      - "05_WiFi_и_приложение/esp8266_ardu_v1/**"
      - "05_WiFi_и_приложение/esp8266_ardu_v2/**"
      - ".github/workflows/esp8266-verify.yml"
  workflow_dispatch:

jobs:
  esp-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266

      - name: Verify no external credential header and prepare single-file test sketch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          src = Path("05_WiFi_и_приложение/esp8266_ardu_v2/esp8266_ardu_v2.ino").read_text()
          assert '#include "wifi_secrets.h"' not in src
          assert "ARDU_CI_BUILD" not in src
          assert "ARDU_CREDENTIALS_CONFIGURED" not in src
          replacement = {
              "ARDU_WIFI_SSID": "CI_STATION_WIFI",
              "ARDU_WIFI_PASSWORD": "CI_TEST_HOME_PASSWORD",
              "ARDU_OTA_PASSWORD": "CI_TEST_OTA_PASSWORD",
              "ARDU_SOFTAP_PASSWORD": "CI_TEST_DIRECT_PASSWORD",
          }
          for key, value in replacement.items():
              pattern = rf'(?m)^(#define\s+{key}\s+)"PUT_[A-Z_]+_HERE"$'
              src, n = re.subn(pattern, lambda m: m[1] + '"' + value + '"', src)
              assert n == 1, f"cannot locate exactly one editable {key} line"
          output = Path(os.environ["RUNNER_TEMP"]) / "esp8266_ardu_v2"
          output.mkdir(parents=True, exist_ok=True)
          (output / "esp8266_ardu_v2.ino").write_text(src)
          assert len(list(output.iterdir())) == 1
          print("PASS: only one .ino with four editable credentials, no local .h")
          PY

      - name: Ensure default placeholders FAIL compilation (OTA safety)
        run: |
          if arduino-cli compile \
            --fqbn esp8266:esp8266:generic \
            --warnings default \
            --build-path "$GITHUB_WORKSPACE/build-esp-v2-unconfigured" \
            "05_WiFi_и_приложение/esp8266_ardu_v2" \
            > "$RUNNER_TEMP/esp-unconfigured.log" 2>&1; then
            echo "ERROR: placeholder ESP firmware compiled unexpectedly"
            exit 1
          fi
          grep -q 'Enter home Wi-Fi SSID' "$RUNNER_TEMP/esp-unconfigured.log"
          echo "PASS: accidental OTA with default placeholder credentials is rejected"

      - name: Compile ESP v2 manually configured ONE-file source
        run: |
          arduino-cli compile \
            --fqbn esp8266:esp8266:generic \
            --warnings default \
            --build-path "$GITHUB_WORKSPACE/build-esp-v2-manual" \
            "$RUNNER_TEMP/esp8266_ardu_v2"
          echo "PASS: manually filled single-file ESP v2 compiles without wifi_secrets.h"

      - name: Compile ARDU ESP8266 v1
        run: |
          arduino-cli compile \
            --fqbn esp8266:esp8266:generic \
            --warnings default \
            --build-path "$GITHUB_WORKSPACE/build-esp-v1" \
            "05_WiFi_и_приложение/esp8266_ardu_v1"
