name: ESP8266 Verify

on:
  push:
    paths:
      - "05_WiFi_и_приложение/esp8266_ardu_v1/**"
      - "05_WiFi_и_приложение/esp8266_ardu_v2/**"
      - ".github/workflows/esp8266-verify.yml"
  workflow_dispatch:

jobs:
  esp-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266

      - name: Compile ARDU ESP8266 v2 Ambient12
        run: |
          arduino-cli compile \
            --fqbn esp8266:esp8266:generic \
            --warnings default \
            --build-property "compiler.cpp.extra_flags=-DARDU_CI_BUILD=1" \
            --build-path "$GITHUB_WORKSPACE/build-esp-v2" \
            "05_WiFi_и_приложение/esp8266_ardu_v2"

      - name: Verify ESP v2 compiles from ONE INO in a clean directory
        run: |
          mkdir -p "$RUNNER_TEMP/esp8266_ardu_v2"
          cp "05_WiFi_и_приложение/esp8266_ardu_v2/esp8266_ardu_v2.ino" \
             "$RUNNER_TEMP/esp8266_ardu_v2/esp8266_ardu_v2.ino"
          test "$(find "$RUNNER_TEMP/esp8266_ardu_v2" -type f | wc -l)" -eq 1
          arduino-cli compile \
            --fqbn esp8266:esp8266:generic \
            --warnings default \
            --build-property "compiler.cpp.extra_flags=-DARDU_CI_BUILD=1" \
            --build-path "$GITHUB_WORKSPACE/build-esp-v2-onefile" \
            "$RUNNER_TEMP/esp8266_ardu_v2"
          echo "PASS: ESP v2 does not need project-local type headers"

      - name: Compile ESP v2 with local credential guard enabled
        run: |
          # Non-secret CI credentials exercise the exact user-side build path.
          # The real wifi_secrets.h stays ignored and local to the owner.
          cat > "05_WiFi_и_приложение/esp8266_ardu_v2/wifi_secrets.h" <<'EOF'
          #pragma once
          #define ARDU_WIFI_SSID "ARDU_CI_STA"
          #define ARDU_WIFI_PASSWORD "ARDU_CI_TEST_PASSWORD"
          #define ARDU_OTA_PASSWORD "ARDU_CI_OTA_PASSWORD"
          #define ARDU_SOFTAP_PASSWORD "ARDU_CI_DIRECT_PASSWORD"
          #define ARDU_CREDENTIALS_CONFIGURED 1
          EOF
          arduino-cli compile \
            --fqbn esp8266:esp8266:generic \
            --warnings default \
            --build-path "$GITHUB_WORKSPACE/build-esp-v2-private-guard" \
            "05_WiFi_и_приложение/esp8266_ardu_v2"
          rm "05_WiFi_и_приложение/esp8266_ardu_v2/wifi_secrets.h"
          echo "PASS: ESP v2 private-header OTA build works without ARDU_CI_BUILD"

      - name: Compile ARDU ESP8266 v1
        run: |
          arduino-cli compile \
            --fqbn esp8266:esp8266:generic \
            --warnings default \
            --build-path "$GITHUB_WORKSPACE/build-esp-v1" \
            "05_WiFi_и_приложение/esp8266_ardu_v1"
