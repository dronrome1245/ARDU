name: ARDU Night Schedule R6 Builder

on:
  push:
    paths:
      - ".github/ardu-night-schedule-r6.trigger"

permissions:
  contents: write

jobs:
  build-r6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Nano R6 and synchronize project docs
        run: python3 .github/ardu-night-schedule-r6-builder.py

      - uses: arduino/setup-arduino-cli@v2

      - name: Install AVR core and FastLED
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install FastLED

      - name: Compile generated Nano R6
        run: |
          mkdir -p "$RUNNER_TEMP/nano_warm_dawn_v6"
          cp "04_Прошивка/nano_warm_dawn_v6/nano_warm_dawn_v6.ino" "$RUNNER_TEMP/nano_warm_dawn_v6/nano_warm_dawn_v6.ino"
          arduino-cli compile \
            --fqbn arduino:avr:nano:cpu=atmega328old \
            --warnings default \
            --build-path "$GITHUB_WORKSPACE/build-nano-warm-dawn-v6" \
            --libraries "$GITHUB_WORKSPACE/04_Прошивка/libraries" \
            "$RUNNER_TEMP/nano_warm_dawn_v6"

      - name: Check Nano R6 memory budget
        run: |
          AVR_SIZE="$(find "$HOME/.arduino15/packages/arduino/tools/avr-gcc" -type f -name avr-size | head -n 1)"
          ELF="$(find "$GITHUB_WORKSPACE/build-nano-warm-dawn-v6" -name '*.elf' | head -n 1)"
          test -n "$AVR_SIZE"
          test -n "$ELF"
          "$AVR_SIZE" -C --mcu=atmega328p "$ELF" | tee /tmp/ardu-r6-size.txt
          FLASH="$(awk '/Program:/ {print $2}' /tmp/ardu-r6-size.txt)"
          RAM="$(awk '/Data:/ {print $2}' /tmp/ardu-r6-size.txt)"
          test "$FLASH" -le 30300
          test "$RAM" -le 1360
          echo "PASS: R6 memory ${FLASH} Flash / ${RAM} global SRAM"

      - name: Commit verified R6 to staging branch
        env:
          BRANCH: ai-night-schedule-r6-20261017
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add \
            "04_Прошивка/nano_warm_dawn_v6/nano_warm_dawn_v6.ino" \
            ".github/workflows/arduino-verify.yml" \
            "00_AI_START_HERE.md" \
            "STATUS.md" \
            "DECISIONS.md" \
            "HISTORY.md" \
            "04_Прошивка/РЕЖИМЫ_РАБОТЫ.md" \
            "05_WiFi_и_приложение/ФУНКЦИОНАЛЬНАЯ_МОДЕЛЬ.md" \
            "05_WiFi_и_приложение/API_V1.md"
          git commit -m "D-125: make Night schedule event-driven and keep manual Night independent"
          git push origin "HEAD:refs/heads/$BRANCH"
