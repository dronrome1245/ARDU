name: Android Verify

on:
  push:
    paths:
      - "05_WiFi_и_приложение/android_app_r1/**"
      - ".github/workflows/android-verify.yml"
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "05_WiFi_и_приложение/android_app_r1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify P01-P12 Android photo assets and bindings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("app")
          assets=root/"src/main/res/drawable-nodpi"
          kotlin=(root/"src/main/java/com/ardu/app/MainActivity.kt").read_text()
          layout=(root/"src/main/res/layout/activity_main.xml").read_text()
          for i in range(1,13):
              name=f"ardu_preset_p{i:02}"
              data=(assets/(name+".webp")).read_bytes()
              assert data.startswith(b"RIFF") and data[8:12]==b"WEBP",name
              assert 2000 < len(data) < 25000,(name,len(data))
              assert f"R.drawable.{name}" in kotlin,name
              if i<=4:
                  assert f'@drawable/{name}' in layout,name
          assert 'chunked(4)' in kotlin
          assert 'ambientExtraPresetButtons[id] = image' in kotlin
          assert 'ambientExtraPresetLabels[id] = label' in kotlin
          # UX regressions from the 2026-10-09 physical-phone walkthrough.
          assert layout.index('android:text="Атмосферные сцены"') < layout.index('android:text="Свой цвет"')
          assert 'android:id="@+id/contentScrollView"' in layout
          assert 'android:id="@+id/musicStartButton"' in layout
          assert 'android:id="@+id/musicStopButton"' in layout
          assert 'contentScrollView.scrollTo(0, 0)' in kotlin
          assert 'UiSafetyPolicy.canSendCommand(deviceOnline)' in kotlin
          assert 'showUnavailableDeviceState()' in kotlin
          assert 'lightFocusDial.setKnown(false)' in kotlin
          assert 'stopDawnButton.isEnabled = UiSafetyPolicy.dawnCanBeStopped' in kotlin
          # Connection heartbeat must check real Nano status, not ping alone;
          # verbose work messages remain available through a saved setting.
          network=(root/"src/main/java/com/ardu/app/net/ArduApiClient.kt").read_text()
          policy=(root/"src/main/java/com/ardu/app/DeviceConnectionPolicy.kt").read_text()
          assert 'fun pingSelected()' in network
          assert 'const val HEARTBEAT_PERIOD_MS = 5_000L' in policy
          assert 'override fun onStart()' in kotlin and 'override fun onStop()' in kotlin
          assert 'mainHandler.removeCallbacks(heartbeatRunnable)' in kotlin
          assert 'api.status()' in kotlin and 'checkDeviceHeartbeat()' in kotlin
          assert 'DeviceConnectionHealth.ESP_ONLY' in kotlin
          assert 'showServiceMessagesSwitch' in kotlin and 'showServiceMessagesSwitch' in layout
          assert 'PREF_SHOW_SERVICE_MESSAGES' in kotlin
          assert 'important = true' in kotlin
          print("PASS: foreground 5s keepalive, Nano liveness and diagnostics preference")
          print("PASS: UX offline-state, tab scroll, music controls and scene ordering")
          print("PASS: 12 embedded WebP thumbnails and 4-column grid")
          # Native Android launcher icons (standard / round / themed) are
          # actual APK resources, not screenshots or website-only logos.
          from xml.etree import ElementTree as ET
          manifest=(root/"src/main/AndroidManifest.xml").read_text()
          assert 'android:icon="@mipmap/ic_launcher"' in manifest
          assert 'android:roundIcon="@mipmap/ic_launcher_round"' in manifest
          for stem in ("ic_launcher","ic_launcher_round"):
              icon=root/"src/main/res/mipmap-anydpi-v26"/f"{stem}.xml"
              doc=ET.parse(icon).getroot()
              assert doc.tag=="adaptive-icon"
              assert [e.tag for e in doc]==["background","foreground","monochrome"]
          for file in ("ardu_launcher_foreground.xml","ardu_launcher_monochrome.xml"):
              vector=root/"src/main/res/drawable"/file
              doc=ET.parse(vector).getroot()
              assert doc.tag=="vector" and len(doc)>1
          foreground=(root/"src/main/res/drawable/ardu_launcher_foreground.xml").read_text()
          assert "#5DE2C5" in foreground and "#F3C969" in foreground
          print("PASS: ARDU adaptive/round/themed desktop icon is bound in the APK manifest")

          # Avoid false failure messages after a confirmed POST and failed GET;
          # retry only read-only network requests and close finished HTTP sockets.
          retry=(root/"src/main/java/com/ardu/app/net/HttpReadbackPolicy.kt").read_text()
          api=(root/"src/main/java/com/ardu/app/net/ArduApiClient.kt").read_text()
          wizard=(root/"src/main/java/com/ardu/app/ClapWizardUiPolicy.kt").read_text()
          assert 'fun shouldRetryGet' in retry
          assert 'HttpReadbackPolicy.shouldRetryGet(error)' in api
          assert 'onAcknowledged?.invoke()' in kotlin
          assert 'устройство подтвердило команду; состояние перечитывается' in kotlin
          assert 'PREF_CLAP_WIZARD_DISMISSED' in kotlin
          assert 'ClapWizardUiPolicy.shouldShow' in kotlin
          assert 'clapSaveButton.setOnClickListener' in kotlin
          assert 'onAcknowledged = { setClapWizardDismissed(true) }' in kotlin
          assert 'android:icon="@mipmap/ic_launcher"' in manifest
          print("PASS: command/readback recovery and CLAPCAL wizard completion")

          PY

      - name: Verify Android v0.22.11 preset-only Ambient, Music submode layout and quick-scene contrast
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root=Path("app/src/main")
          xml=(root/"res/layout/activity_main.xml").read_text()
          layout=ET.fromstring(xml)
          ns="{http://schemas.android.com/apk/res/android}"
          nodes={node.get(ns+"id","").replace("@+id/",""):node for node in layout.iter() if node.get(ns+"id")}
          parents={child:parent for parent in layout.iter() for child in parent}
          def hidden_by_ancestor(node):
              while node in parents:
                  node=parents[node]
                  if node.get(ns+"visibility")=="gone":
                      return True
              return False

          # Legacy F01 manual controls remain only as invisible binding targets
          # so the device's existing EEPROM / F01 API needs no firmware migration.
          for name in ("ambientF01Button","ambientHueSeek","ambientSaturationSeek",
                       "ambientBrightnessSeek","ambientSpeedSeek","ambientAutoSwitch"):
              assert hidden_by_ancestor(nodes[name]), name
          for name in ("ambientOnButton","ambientOffButton","ambientPresetAurora",
                       "ambientPresetSunset","ambientPresetOcean","ambientPresetCosmos"):
              assert not hidden_by_ancestor(nodes[name]), name
          assert xml.index('android:text="Атмосферные сцены"') < xml.index('android:text="Свой цвет"')

          # M05/M08 frequency submodes are a real full-width 4-column row
          # before every effect slider, not a clipped horizontal scroll.
          assert xml.index('android:id="@+id/musicSubmodeGroup"') < \
                 xml.index('android:id="@+id/musicBrightnessText"')
          sub=nodes["musicSubmodeGroup"]
          subButtons=("musicSubThree","musicSubLow","musicSubMid","musicSubHigh")
          for name in subButtons:
              n=nodes[name]
              assert n.get(ns+"layout_width")=="0dp",name
              assert n.get(ns+"layout_weight")=="1",name
              assert n.get(ns+"background")=="@drawable/ardu_music_submode_choice",name
              p=n
              while p is not sub:
                  assert p in parents,name
                  p=parents[p]
              assert n.get(ns+"singleLine")=="true",name
          drawable=(root/"res/drawable/ardu_music_submode_choice.xml").read_text()
          assert 'android:state_selected="true"' in drawable
          assert "@color/ardu_accent" in drawable
          assert nodes["musicBackgroundColorInfo"].get(ns+"layout_width")=="match_parent"

          kotlin=(root/"java/com/ardu/app/MainActivity.kt").read_text()
          scenes=(root/"java/com/ardu/app/LightQuickScenes.kt").read_text()
          preview=(root/"java/com/ardu/app/ui/SceneTileView.kt").read_text()
          bgpolicy=(root/"java/com/ardu/app/MusicBackgroundUiPolicy.kt").read_text()
          assert "musicSubmodeGroup.visibility" in kotlin
          assert 'button.isSelected = chosen' in kotlin
          assert "R.color.ardu_on_accent" in kotlin
          assert 'MusicBackgroundUiPolicy.usesBackgroundBrightness(id)' in kotlin
          assert 'MusicBackgroundUiPolicy.colorExplanation(id)' in kotlin
          assert 'musicBackgroundGroup.visibility' in kotlin
          assert 'ambientManualPanel.visibility = View.GONE' in kotlin
          assert 'api.selectAmbientPreset(selected)' in kotlin
          assert "LightQuickScenes.EVENING" in kotlin and "LightQuickScenes.CINEMA" in kotlin
          assert 'LightQuickScene(kelvin = 2700, brightness = 115)' in scenes
          assert 'LightQuickScene(kelvin = 1800, brightness = 18)' in scenes
          assert "LightQuickScenes.CINEMA.percent" in preview
          assert "Scene.WARM -> LinearGradient(" in preview
          assert "Scene.EVENING -> LinearGradient(" in preview
          assert "background_brightness" not in bgpolicy, \
              "color policy should not fake independent background API fields"
          print("PASS: preset-only Ambient, full-width selected Music row above sliders")
          print("PASS: music background color truth and visibly distinct Evening/Cinema")
          PY

      - name: Unit contract tests
        run: bash ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Publish Android 0.22.11 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ardu-android-02211-presets-music-scenes-debug-apk
          path: 05_WiFi_и_приложение/android_app_r1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
