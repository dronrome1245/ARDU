name: Android Verify

on:
  push:
    paths:
      - "05_WiFi_и_приложение/android_app_r1/**"
      - ".github/workflows/android-verify.yml"
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "05_WiFi_и_приложение/android_app_r1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify P01-P12 Android photo assets and bindings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("app")
          assets=root/"src/main/res/drawable-nodpi"
          kotlin=(root/"src/main/java/com/ardu/app/MainActivity.kt").read_text()
          layout=(root/"src/main/res/layout/activity_main.xml").read_text()
          for i in range(1,13):
              name=f"ardu_preset_p{i:02}"
              data=(assets/(name+".webp")).read_bytes()
              assert data.startswith(b"RIFF") and data[8:12]==b"WEBP",name
              assert 2000 < len(data) < 25000,(name,len(data))
              assert f"R.drawable.{name}" in kotlin,name
              if i<=4:
                  assert f'@drawable/{name}' in layout,name
          assert 'chunked(4)' in kotlin
          assert 'ambientExtraPresetButtons[id] = image' in kotlin
          assert 'ambientExtraPresetLabels[id] = label' in kotlin
          # UX regressions from the 2026-10-09 physical-phone walkthrough.
          assert layout.index('android:text="Атмосферные сцены"') < layout.index('android:text="Свой цвет"')
          assert 'android:id="@+id/contentScrollView"' in layout
          assert 'android:id="@+id/musicStartButton"' in layout
          assert 'android:id="@+id/musicStopButton"' in layout
          assert 'contentScrollView.scrollTo(0, 0)' in kotlin
          assert 'UiSafetyPolicy.canSendCommand(deviceOnline)' in kotlin
          assert 'showUnavailableDeviceState()' in kotlin
          assert 'lightFocusDial.setKnown(false)' in kotlin
          assert 'stopDawnButton.isEnabled = UiSafetyPolicy.dawnCanBeStopped' in kotlin
          # Connection heartbeat must check real Nano status, not ping alone;
          # verbose work messages remain available through a saved setting.
          network=(root/"src/main/java/com/ardu/app/net/ArduApiClient.kt").read_text()
          policy=(root/"src/main/java/com/ardu/app/DeviceConnectionPolicy.kt").read_text()
          assert 'fun pingSelected()' in network
          assert 'const val HEARTBEAT_PERIOD_MS = 5_000L' in policy
          assert 'override fun onStart()' in kotlin and 'override fun onStop()' in kotlin
          assert 'mainHandler.removeCallbacks(heartbeatRunnable)' in kotlin
          assert 'api.status()' in kotlin and 'checkDeviceHeartbeat()' in kotlin
          assert 'DeviceConnectionHealth.ESP_ONLY' in kotlin
          assert 'showServiceMessagesSwitch' in kotlin and 'showServiceMessagesSwitch' in layout
          assert 'PREF_SHOW_SERVICE_MESSAGES' in kotlin
          assert 'important = true' in kotlin
          print("PASS: foreground 5s keepalive, Nano liveness and diagnostics preference")
          print("PASS: UX offline-state, tab scroll, music controls and scene ordering")
          print("PASS: 12 embedded WebP thumbnails and 4-column grid")
          PY

      - name: Unit contract tests
        run: bash ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Publish Android debug APK for Ambient12 smoke test
        uses: actions/upload-artifact@v4
        with:
          name: ardu-android-ambient12-debug-apk
          path: 05_WiFi_и_приложение/android_app_r1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
