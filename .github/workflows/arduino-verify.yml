name: Arduino Verify

on:
  push:
    paths:
      - "04_Прошивка/nano_ardu_v1/**"
      - "04_Прошивка/nano_ambient_preview_rc1/**"
      - "04_Прошивка/nano_ambient_preview_rc2/**"
      - "04_Прошивка/nano_ambient12_v1/**"
      - "04_Прошивка/nano_ambient12_v2/**"
      - "04_Прошивка/nano_ambient12_v3/**"
      - "04_Прошивка/nano_ambient12_v4/**"
      - "04_Прошивка/nano_warm_dawn_v5/**"
      - ".github/workflows/arduino-verify.yml"
  workflow_dispatch:

jobs:
  nano-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Install FastLED
        run: arduino-cli lib install FastLED

      - name: Verify IDE preview mirrors the full Nano source and renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("04_Прошивка")
          main = (root / "nano_ardu_v1" / "nano_ardu_v1.ino").read_bytes()
          preview = (root / "nano_ambient_preview_rc1" / "nano_ambient_preview_rc1.ino").read_bytes()
          assert preview == b"#define ARDU_AMBIENT_PRESET_PROBE 1\n" + main, "preview source drift"
          head = (root / "nano_ardu_v1" / "ambient_preset_probe.h").read_bytes()
          copy = (root / "nano_ambient_preview_rc1" / "ambient_preset_probe.h").read_bytes()
          assert copy == head, "preview renderer drift"
          print("PASS: preview RC1 is the complete Nano v1 + build flag")
          PY

      - name: Verify RC2 is one-file self-contained complete Nano v1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("04_Прошивка")
          base = (root / "nano_ardu_v1" / "nano_ardu_v1.ino").read_bytes()
          header = (root / "nano_ardu_v1" / "ambient_preset_probe.h").read_bytes()
          actual = (root / "nano_ambient_preview_rc2" / "nano_ambient_preview_rc2.ino").read_bytes()
          assert header.startswith(b"#pragma once\n")
          start = "/* INLINE RENDERER BEGIN — generated from nano_ardu_v1/ambient_preset_probe.h; NO LOCAL HEADER REQUIRED */\n".encode()
          end = b"/* INLINE RENDERER END */"
          expected = b"#define ARDU_AMBIENT_PRESET_PROBE 1\n" + base.replace(
              b'#include "ambient_preset_probe.h"',
              start + header[len(b"#pragma once\n"):] + end
          )
          assert actual == expected, "RC2 differs from full Nano v1 + embedded renderer"
          assert b'#include "ambient_preset_probe.h"' not in actual, "RC2 has a local header dependency"
          assert not (root / "nano_ambient_preview_rc2" / "ambient_preset_probe.h").exists()
          print("PASS: RC2 is complete Nano v1 + embedded renderer, zero local headers")
          PY

      - name: Host test experimental 44-LED preset renderers
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            "04_Прошивка/nano_ardu_v1/tests/ambient_preset_probe_host.cpp" \
            -o "$RUNNER_TEMP/ardu-ambient-probe-test"
          "$RUNNER_TEMP/ardu-ambient-probe-test"

      - name: Compile ARDU Nano v1
        run: |
          arduino-cli compile \
            --fqbn arduino:avr:nano:cpu=atmega328old \
            --warnings default \
            --build-path "$GITHUB_WORKSPACE/build-nano-v1" \
            --libraries "$GITHUB_WORKSPACE/04_Прошивка/libraries" \
            "04_Прошивка/nano_ardu_v1"

      - name: Compile full Nano with PREVIEW-ONLY Ambient probe
        run: |
          arduino-cli compile \
            --fqbn arduino:avr:nano:cpu=atmega328old \
            --warnings default \
            --build-property "compiler.cpp.extra_flags=-DARDU_AMBIENT_PRESET_PROBE=1" \
            --build-path "$GITHUB_WORKSPACE/build-nano-ambient-probe" \
            --libraries "$GITHUB_WORKSPACE/04_Прошивка/libraries" \
            "04_Прошивка/nano_ardu_v1"

      - name: Compile IDE-openable full Nano Ambient preview RC1
        run: |
          arduino-cli compile \
            --fqbn arduino:avr:nano:cpu=atmega328old \
            --warnings default \
            --build-path "$GITHUB_WORKSPACE/build-nano-ambient-preview-rc1" \
            --libraries "$GITHUB_WORKSPACE/04_Прошивка/libraries" \
            "04_Прошивка/nano_ambient_preview_rc1"

      - name: Compile RC2 copied ALONE into isolated Arduino sketch folder
        run: |
          mkdir -p "$RUNNER_TEMP/nano_ambient_preview_rc2"
          cp "04_Прошивка/nano_ambient_preview_rc2/nano_ambient_preview_rc2.ino" \
             "$RUNNER_TEMP/nano_ambient_preview_rc2/nano_ambient_preview_rc2.ino"
          test "$(find "$RUNNER_TEMP/nano_ambient_preview_rc2" -type f | wc -l)" -eq 1
          arduino-cli compile \
            --fqbn arduino:avr:nano:cpu=atmega328old \
            --warnings default \
            --build-path "$GITHUB_WORKSPACE/build-nano-ambient-preview-rc2" \
            --libraries "$GITHUB_WORKSPACE/04_Прошивка/libraries" \
            "$RUNNER_TEMP/nano_ambient_preview_rc2"
          echo "PASS: Nano Ambient Preview RC2 compiled with ONLY one .ino file"

      - name: Host-test actual R2 preset clock and all 12 renderers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("04_Прошивка/nano_ambient12_v2")
          src=(root/"nano_ambient12_v2.ino").read_text()
          baseline=Path("04_Прошивка/nano_ambient12_v1/nano_ambient12_v1.ino").read_text()
          assert 'constexpr uint8_t FW_REV = 3;' in src
          assert 'Serial.println(F("ARDU1 3"))' in src
          assert 'presetCfg.dynamics[scene],presetPhaseQ16' in src
          assert 'if(speed>170)' not in src and 'else if(speed<70)' not in src
          assert 'static_assert(sizeof(PresetPersist)==29' in src
          assert 'constexpr int PRESET_BASE = 512;' in baseline and 'constexpr int PRESET_BASE = 512;' in src
          assert 'case 111:' in src and 'case 115:' in src
          assert 'ambient_preset_probe.h' not in src, "One-file upload must have no local header dependency"
          marker1="// PRESET_MOTION_BEGIN"
          marker2="// PRESET_MOTION_END"
          assert src.count(marker1)==1 and src.count(marker2)==1
          motion=src.split(marker1,1)[1].split(marker2,1)[0]
          head='uint8_t presetTri(uint8_t a){'
          tail='void printPresets(){'
          assert src.count(head)==1 and src.count(tail)==1
          render=src.split(head,1)[1].split(tail,1)[0]
          render=head+render
          wrapper=(root/"tests/preset_motion_host.cpp").read_text()
          assert wrapper.count("// @INJECT_PRESET_CLOCK")==1
          assert wrapper.count("// @INJECT_PRESET_RENDERER")==1
          output=wrapper.replace("// @INJECT_PRESET_CLOCK",motion).replace("// @INJECT_PRESET_RENDERER",render)
          Path("build-nano-r2-preset-host.cpp").write_text(output)
          print("PASS: host test uses exact Nano R2 clock and renderer source")
          PY
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic             build-nano-r2-preset-host.cpp -o "$RUNNER_TEMP/ardu-nano-r2-preset-host"
          "$RUNNER_TEMP/ardu-nano-r2-preset-host"

      - name: Host-test exact R3 P11 breathing rate and all 12 renderers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("04_Прошивка/nano_ambient12_v3")
          src=(root/"nano_ambient12_v3.ino").read_text()
          old=Path("04_Прошивка/nano_ambient12_v2/nano_ambient12_v2.ino").read_text()
          assert 'constexpr uint8_t FW_REV = 4;' in src
          assert 'Serial.println(F("ARDU1 4"))' in src
          assert 'scene==10U' in src
          assert 'static_assert(sizeof(PresetPersist)==29' in src
          assert 'ambient_preset_probe.h' not in src
          assert 'constexpr int PRESET_BASE = 512;' in src
          assert 'case 111:' in src and 'case 115:' in src
          head='uint8_t presetTri(uint8_t a){'
          tail='void printPresets(){'
          assert old.split(head,1)[1].split(tail,1)[0] == src.split(head,1)[1].split(tail,1)[0], \
              "P01-P12 pixel renderers must remain byte-for-byte unchanged"
          marker1="// PRESET_MOTION_BEGIN"
          marker2="// PRESET_MOTION_END"
          assert src.count(marker1)==1 and src.count(marker2)==1
          motion=src.split(marker1,1)[1].split(marker2,1)[0]
          render=head+src.split(head,1)[1].split(tail,1)[0]
          wrapper=(root/"tests/preset_motion_host.cpp").read_text()
          assert wrapper.count("// @INJECT_PRESET_CLOCK")==1
          assert wrapper.count("// @INJECT_PRESET_RENDERER")==1
          output=wrapper.replace("// @INJECT_PRESET_CLOCK",motion).replace("// @INJECT_PRESET_RENDERER",render)
          Path("build-nano-r3-preset-host.cpp").write_text(output)
          print("PASS: host test uses real R3 clock and byte-identical R2 renderers")
          PY
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            build-nano-r3-preset-host.cpp -o "$RUNNER_TEMP/ardu-nano-r3-preset-host"
          "$RUNNER_TEMP/ardu-nano-r3-preset-host"

      - name: Host-test all R4 scenes visibly animate on 44 LEDs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("04_Прошивка/nano_ambient12_v4")
          src=(root/"nano_ambient12_v4.ino").read_text()
          baseline=Path("04_Прошивка/nano_ambient12_v3/nano_ambient12_v3.ino").read_text()
          assert 'constexpr uint8_t FW_REV = 5;' in src
          assert 'Serial.println(F("ARDU1 5"))' in src
          assert src.count('case 111:')==1 and src.count('case 115:')==1
          assert 'static_assert(sizeof(PresetPersist)==29' in src
          assert 'constexpr int PRESET_BASE = 512;' in src
          assert 'ambient_preset_probe.h' not in src, "One-file Nano R4 must not need a local .h"
          assert src.split('// PRESET_MOTION_BEGIN',1)[1].split('// PRESET_MOTION_END',1)[0] == \
                 baseline.split('// PRESET_MOTION_BEGIN',1)[1].split('// PRESET_MOTION_END',1)[0], \
                 "P11 clock MUST stay identical to approved R3"
          def breathing_body(text):
              return text.split('case 10: // breathing: whole circle slow pulse',1)[1].split('default:',1)[0]
          assert breathing_body(src)==breathing_body(baseline), "P11 renderer MUST remain bitwise identical"
          head='uint8_t presetTri(uint8_t a){'
          tail='void printPresets(){'
          assert src.count(head)==1 and src.count(tail)==1
          motion=src.split('// PRESET_MOTION_BEGIN',1)[1].split('// PRESET_MOTION_END',1)[0]
          render=head+src.split(head,1)[1].split(tail,1)[0]
          wrapper=(root/"tests/preset_motion_host.cpp").read_text()
          assert wrapper.count('// @INJECT_PRESET_CLOCK')==1
          assert wrapper.count('// @INJECT_PRESET_RENDERER')==1
          output=wrapper.replace('// @INJECT_PRESET_CLOCK',motion).replace('// @INJECT_PRESET_RENDERER',render)
          Path("build-nano-r4-visible-scenes-host.cpp").write_text(output)
          print("PASS: extracted exact Nano R4 renderer and preserved R3 P11")
          PY
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            build-nano-r4-visible-scenes-host.cpp -o "$RUNNER_TEMP/ardu-nano-r4-scenes"
          "$RUNNER_TEMP/ardu-nano-r4-scenes"

      - name: Compile full Nano v2 with twelve scenes
        run: |
          arduino-cli compile \
            --fqbn arduino:avr:nano:cpu=atmega328old \
            --warnings default \
            --build-path "$GITHUB_WORKSPACE/build-nano-ambient12-v1" \
            --libraries "$GITHUB_WORKSPACE/04_Прошивка/libraries" \
            "04_Прошивка/nano_ambient12_v1"

      - name: Compile full Nano Ambient12 R2 continuous-speed release candidate
        run: |
          arduino-cli compile             --fqbn arduino:avr:nano:cpu=atmega328old             --warnings default             --build-path "$GITHUB_WORKSPACE/build-nano-ambient12-v2"             --libraries "$GITHUB_WORKSPACE/04_Прошивка/libraries"             "04_Прошивка/nano_ambient12_v2"

      - name: Verify full Nano R2 Flash and globals against R1 baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          sizes=list(Path.home().glob(".arduino15/packages/arduino/tools/avr-gcc/*/bin/avr-size"))
          assert len(sizes)>0,"avr-size binary missing"
          exe=str(sizes[-1])
          def measure(folder):
              elfs=list(Path(folder).rglob("*.elf"))
              assert len(elfs)==1,(folder,elfs)
              output=subprocess.check_output([exe,"-C","--mcu=atmega328p",str(elfs[0])],text=True)
              print(folder,output)
              p=re.search(r"Program:\s*(\d+) bytes",output)
              d=re.search(r"Data:\s*(\d+) bytes",output)
              assert p and d,output
              return int(p.group(1)),int(d.group(1))
          old_flash,old_globals=measure("build-nano-ambient12-v1")
          new_flash,new_globals=measure("build-nano-ambient12-v2")
          print(f"Baseline {old_flash}/{old_globals}, R2 {new_flash}/{new_globals}")
          assert new_flash<=old_flash+400,(old_flash,new_flash,"unexpected Flash regression")
          assert new_flash<=30000,(new_flash,"insufficient program margin")
          assert new_globals<=old_globals+16,(old_globals,new_globals,"unexpected SRAM regression")
          assert new_globals<=1350,(new_globals,"insufficient global SRAM margin")
          print("PASS: full Nano R2 Flash/SRAM compile-size gate; runtime stack still physical gate")
          PY

      - name: Compile full Nano Ambient12 R3 P11 minimum-speed tune
        run: |
          arduino-cli compile \
            --fqbn arduino:avr:nano:cpu=atmega328old \
            --warnings default \
            --build-path "$GITHUB_WORKSPACE/build-nano-ambient12-v3" \
            --libraries "$GITHUB_WORKSPACE/04_Прошивка/libraries" \
            "04_Прошивка/nano_ambient12_v3"

      - name: Verify full Nano R3 Flash and globals against approved R2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          sizes=list(Path.home().glob(".arduino15/packages/arduino/tools/avr-gcc/*/bin/avr-size"))
          assert sizes, "avr-size missing"
          def measure(folder):
              elfs=list(Path(folder).rglob("*.elf"))
              assert len(elfs)==1, (folder, elfs)
              result=subprocess.check_output([str(sizes[-1]), "-C", "--mcu=atmega328p", str(elfs[0])],text=True)
              print(folder,result)
              a=re.search(r"Program:\s*(\d+) bytes",result)
              b=re.search(r"Data:\s*(\d+) bytes",result)
              assert a and b,result
              return int(a.group(1)),int(b.group(1))
          r2_flash,r2_globals=measure("build-nano-ambient12-v2")
          r3_flash,r3_globals=measure("build-nano-ambient12-v3")
          print(f"R2 {r2_flash}/{r2_globals}; R3 {r3_flash}/{r3_globals}")
          assert r3_flash<=r2_flash+150, (r2_flash,r3_flash,"flash regression")
          assert r3_flash<=30000, ("flash budget",r3_flash)
          assert r3_globals<=r2_globals+8, (r2_globals,r3_globals,"SRAM regression")
          assert r3_globals<=1350, ("global SRAM budget",r3_globals)
          print("PASS: complete R3 Nano compile and memory; physical stack test still required")
          PY

      - name: Compile R4 as standalone Nano sketch, isolated from local headers
        run: |
          mkdir -p "$RUNNER_TEMP/nano_ambient12_v4"
          cp "04_Прошивка/nano_ambient12_v4/nano_ambient12_v4.ino" \
             "$RUNNER_TEMP/nano_ambient12_v4/nano_ambient12_v4.ino"
          test "$(find "$RUNNER_TEMP/nano_ambient12_v4" -maxdepth 1 -type f | wc -l)" -eq 1
          arduino-cli compile \
            --fqbn arduino:avr:nano:cpu=atmega328old \
            --warnings default \
            --build-path "$GITHUB_WORKSPACE/build-nano-ambient12-v4" \
            --libraries "$GITHUB_WORKSPACE/04_Прошивка/libraries" \
            "$RUNNER_TEMP/nano_ambient12_v4"
          echo "PASS: full 44+44 Nano R4 compiles from only one .ino"

      - name: Compare complete R4 flash and SRAM against R3
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          sizes=list(Path.home().glob(".arduino15/packages/arduino/tools/avr-gcc/*/bin/avr-size"))
          assert sizes, "missing avr-size"
          def usage(directory):
              elf=list(Path(directory).rglob("*.elf"))
              assert len(elf)==1,(directory,elf)
              result=subprocess.check_output([str(sizes[-1]),"-C","--mcu=atmega328p",str(elf[0])],text=True)
              print(directory,result)
              flash=re.search(r"Program:\s*(\d+) bytes",result)
              globals=re.search(r"Data:\s*(\d+) bytes",result)
              assert flash and globals,result
              return int(flash.group(1)),int(globals.group(1))
          old_f,old_s=usage("build-nano-ambient12-v3")
          new_f,new_s=usage("build-nano-ambient12-v4")
          print(f"R3 {old_f} Flash/{old_s} global SRAM; R4 {new_f} Flash/{new_s} global SRAM")
          assert new_f<=30720,("ATmega328P Nano Flash overflow",new_f)
          assert new_s<=1360,("Nano global SRAM regression",new_s)
          assert new_f<=30300,("Nano leaves under 420 bytes program margin",new_f)
          print("PASS: full Nano R4 size; worst-case runtime stack/power must be tested on hardware")
          PY

      - name: Verify Nano R5 warmth, RTC wake-time, and EEPROM migration guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("04_Прошивка/nano_warm_dawn_v5/nano_warm_dawn_v5.ino")
          s=p.read_text()
          assert "constexpr uint8_t DAWN_VER = 2;" in s
          assert "DEFAULT_DAWN_START_STEP = (2000-" in s
          assert "DEFAULT_DAWN_END_STEP = (3600-" in s
          assert "b[5]<=Cfg::DAWN_MAX_STEP" in s and "b[5]<=b[6]" in s
          assert "case 78: // atomic warm Kelvin endpoints" in s
          assert "fill_solid(leds,Cfg::LED_COUNT,kelvinRgb(dawnKelvin(p)))" in s
          assert "dawnBrightness(p)" in s
          assert "CHSV(h,255,255)" not in s
          assert "if(minuteOfDay(now.hour,now.minute)==start" in s
          assert "wake+1440U-dawnCfg.fadeMinutes" in s
          assert 'Serial.println(F("ARDU1 6"))' in s
          for start,end in [(1800,3200),(2000,3600),(2200,4000),(1800,3000)]:
              a=(start-1800)//20;b=(end-1800)//20
              assert start%20==0 and end%20==0 and 0<=a<=b<=110
              assert 1800+20*a==start and 1800+20*b==end
              for p in range(0,1001):
                  k=1800+20*(a+(b-a)*p//1000)
                  assert start<=k<=end
              assert 1800+20*(a+(b-a)*1000//1000)==end
          for wake,fade,start in [(420,30,390),(10,30,1420),(0,40,1400)]:
              assert (wake+1440-fade)%1440==start
          print("PASS: R5 never uses HSV dawn; 4 real warm presets, wake-before-alarm")
          PY

      - name: Compile full standalone Nano R5 warm dawn
        run: |
          mkdir -p "$RUNNER_TEMP/nano_warm_dawn_v5"
          cp "04_Прошивка/nano_warm_dawn_v5/nano_warm_dawn_v5.ino"              "$RUNNER_TEMP/nano_warm_dawn_v5/nano_warm_dawn_v5.ino"
          arduino-cli compile             --fqbn arduino:avr:nano:cpu=atmega328old             --warnings default             --build-path "$GITHUB_WORKSPACE/build-nano-warm-dawn-v5"             --libraries "$GITHUB_WORKSPACE/04_Прошивка/libraries"             "$RUNNER_TEMP/nano_warm_dawn_v5"

      - name: Measure R5 flash/SRAM vs last verified R4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          sizes=sorted(Path.home().glob(".arduino15/packages/arduino/tools/avr-gcc/*/bin/avr-size"))
          assert sizes
          def mem(folder):
              files=list(Path(folder).rglob("*.elf"))
              assert len(files)==1,(folder,files)
              out=subprocess.check_output([str(sizes[-1]),"-C","--mcu=atmega328p",str(files[0])],text=True)
              print(out)
              flash=int(re.search(r"Program:\s*(\d+) bytes",out).group(1))
              ram=int(re.search(r"Data:\s*(\d+) bytes",out).group(1))
              return flash,ram
          a=mem("build-nano-ambient12-v4");b=mem("build-nano-warm-dawn-v5")
          print("R4:",a,"R5:",b)
          assert b[0]<=30300,("flash margin",b)
          assert b[1]<=1360,("globals SRAM guard",b)
          print("PASS: Nano R5 remains within AVR project memory budget; stack still needs physical test")
          PY

      - name: Size profile
        if: always()
        run: |
          AVR_BIN="$(dirname "$(find "$HOME/.arduino15/packages/arduino/tools/avr-gcc" -type f -name avr-nm | head -n 1)")"
          ELF="$(find "$GITHUB_WORKSPACE/build-nano-v1" -name '*.elf' | head -n 1)"
          if [ -z "$ELF" ]; then echo "No ELF produced"; exit 0; fi
          "$AVR_BIN/avr-size" -A "$ELF" || true
          echo "--- largest flash/all symbols ---"
          "$AVR_BIN/avr-nm" -S --size-sort "$ELF" | tail -n 100 || true
          echo "--- SRAM symbols ---"
          "$AVR_BIN/avr-nm" -S --size-sort "$ELF" | grep -E ' [BbDd] ' | tail -n 100 || true
          echo "--- Full Nano Ambient lab probe size ---"
          PROBE_ELF="$(find "$GITHUB_WORKSPACE/build-nano-ambient-probe" -name '*.elf' | head -n 1)"
          if [ -n "$PROBE_ELF" ]; then "$AVR_BIN/avr-size" -C --mcu=atmega328p "$PROBE_ELF" || true; fi
          echo "--- one-file PREVIEW RC2 size ---"
          RC2_ELF="$(find "$GITHUB_WORKSPACE/build-nano-ambient-preview-rc2" -name '*.elf' | head -n 1)"
          if [ -n "$RC2_ELF" ]; then "$AVR_BIN/avr-size" -C --mcu=atmega328p "$RC2_ELF"; fi
          echo "--- IDE preview RC1 firmware size ---"
          RC_ELF="$(find "$GITHUB_WORKSPACE/build-nano-ambient-preview-rc1" -name '*.elf' | head -n 1)"
          if [ -n "$RC_ELF" ]; then "$AVR_BIN/avr-size" -C --mcu=atmega328p "$RC_ELF"; fi

      - name: Publish full Nano R5 warm Kelvin sunrise HEX
        uses: actions/upload-artifact@v4
        with:
          name: ardu-nano-warm-dawn-v5-rc1
          path: build-nano-warm-dawn-v5/*.hex
