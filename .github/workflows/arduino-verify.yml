name: Arduino Verify

on:
  push:
    paths:
      - "04_Прошивка/nano_ardu_v1/**"
      - "04_Прошивка/nano_ambient_preview_rc1/**"
      - ".github/workflows/arduino-verify.yml"
  workflow_dispatch:

jobs:
  nano-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Install FastLED
        run: arduino-cli lib install FastLED

      - name: Verify IDE preview mirrors the full Nano source and renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("04_Прошивка")
          main = (root / "nano_ardu_v1" / "nano_ardu_v1.ino").read_bytes()
          preview = (root / "nano_ambient_preview_rc1" / "nano_ambient_preview_rc1.ino").read_bytes()
          assert preview == b"#define ARDU_AMBIENT_PRESET_PROBE 1\n" + main, "preview source drift"
          head = (root / "nano_ardu_v1" / "ambient_preset_probe.h").read_bytes()
          copy = (root / "nano_ambient_preview_rc1" / "ambient_preset_probe.h").read_bytes()
          assert copy == head, "preview renderer drift"
          print("PASS: preview RC1 is the complete Nano v1 + build flag")
          PY

      - name: Host test experimental 44-LED preset renderers
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            "04_Прошивка/nano_ardu_v1/tests/ambient_preset_probe_host.cpp" \
            -o "$RUNNER_TEMP/ardu-ambient-probe-test"
          "$RUNNER_TEMP/ardu-ambient-probe-test"

      - name: Compile ARDU Nano v1
        run: |
          arduino-cli compile \
            --fqbn arduino:avr:nano:cpu=atmega328old \
            --warnings default \
            --build-path "$GITHUB_WORKSPACE/build-nano-v1" \
            --libraries "$GITHUB_WORKSPACE/04_Прошивка/libraries" \
            "04_Прошивка/nano_ardu_v1"

      - name: Compile full Nano with PREVIEW-ONLY Ambient probe
        run: |
          arduino-cli compile \
            --fqbn arduino:avr:nano:cpu=atmega328old \
            --warnings default \
            --build-property "compiler.cpp.extra_flags=-DARDU_AMBIENT_PRESET_PROBE=1" \
            --build-path "$GITHUB_WORKSPACE/build-nano-ambient-probe" \
            --libraries "$GITHUB_WORKSPACE/04_Прошивка/libraries" \
            "04_Прошивка/nano_ardu_v1"

      - name: Compile IDE-openable full Nano Ambient preview RC1
        run: |
          arduino-cli compile \
            --fqbn arduino:avr:nano:cpu=atmega328old \
            --warnings default \
            --build-path "$GITHUB_WORKSPACE/build-nano-ambient-preview-rc1" \
            --libraries "$GITHUB_WORKSPACE/04_Прошивка/libraries" \
            "04_Прошивка/nano_ambient_preview_rc1"

      - name: Size profile
        if: always()
        run: |
          AVR_BIN="$(dirname "$(find "$HOME/.arduino15/packages/arduino/tools/avr-gcc" -type f -name avr-nm | head -n 1)")"
          ELF="$(find "$GITHUB_WORKSPACE/build-nano-v1" -name '*.elf' | head -n 1)"
          if [ -z "$ELF" ]; then echo "No ELF produced"; exit 0; fi
          "$AVR_BIN/avr-size" -A "$ELF" || true
          echo "--- largest flash/all symbols ---"
          "$AVR_BIN/avr-nm" -S --size-sort "$ELF" | tail -n 100 || true
          echo "--- SRAM symbols ---"
          "$AVR_BIN/avr-nm" -S --size-sort "$ELF" | grep -E ' [BbDd] ' | tail -n 100 || true
          echo "--- Full Nano Ambient lab probe size ---"
          PROBE_ELF="$(find "$GITHUB_WORKSPACE/build-nano-ambient-probe" -name '*.elf' | head -n 1)"
          if [ -n "$PROBE_ELF" ]; then "$AVR_BIN/avr-size" -C --mcu=atmega328p "$PROBE_ELF" || true; fi
          echo "--- IDE preview RC1 firmware size ---"
          RC_ELF="$(find "$GITHUB_WORKSPACE/build-nano-ambient-preview-rc1" -name '*.elf' | head -n 1)"
          if [ -n "$RC_ELF" ]; then "$AVR_BIN/avr-size" -C --mcu=atmega328p "$RC_ELF"; fi

      - name: Publish compiled Ambient preview RC1 HEX for recovery/test
        uses: actions/upload-artifact@v4
        with:
          name: ardu-nano-ambient-preview-rc1
          path: build-nano-ambient-preview-rc1/*.hex
          if-no-files-found: error
          retention-days: 30
