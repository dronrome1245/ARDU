name: One-shot Nano Bridge R3 Diagnostics

on:
  push:
    paths:
      - ".github/workflows/_oneshot_r3_diag.yml"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch ESP R3 diagnostics and project status
        run: python3 tools/_oneshot_r3_diag_patch.py

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266

      - name: Compile configured ESP V4 R3 DIAG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          source=Path('05_WiFi_и_приложение/esp8266_nano_remote_v4/esp8266_nano_remote_v4.ino').read_text()
          for key,value in {
            'ARDU_WIFI_SSID':'CI_HOME_WIFI',
            'ARDU_WIFI_PASSWORD':'CI_HOME_PASSWORD',
            'ARDU_OTA_PASSWORD':'CI_OTA_PASSWORD',
            'ARDU_SOFTAP_PASSWORD':'CI_DIRECT_PASSWORD',
          }.items():
            pat=rf'(?m)^(#define\s+{key}\s+)"PUT_[A-Z_]+_HERE"$'
            source,n=re.subn(pat,lambda m:m[1]+'"'+value+'"',source)
            assert n==1,key
          out=Path(os.environ['RUNNER_TEMP'])/'esp8266_nano_remote_v4'
          out.mkdir(parents=True,exist_ok=True)
          (out/'esp8266_nano_remote_v4.ino').write_text(source)
          PY
          arduino-cli compile \
            --fqbn esp8266:esp8266:generic \
            --warnings default \
            --build-path "$RUNNER_TEMP/build-r3-diag" \
            "$RUNNER_TEMP/esp8266_nano_remote_v4"

      - name: Publish R3 diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "05_WiFi_и_приложение/esp8266_nano_remote_v4/esp8266_nano_remote_v4.ino" \
            "STATUS.md" "HISTORY.md" "SOURCES.md" "00_AI_START_HERE.md" \
            "02_Архитектура_и_решения/NANO_REMOTE_FLASH.md"
          git diff --cached --quiet && { echo "Nothing to publish"; exit 1; }
          git commit -m "diag: instrument Nano verify UART path"
          git push origin HEAD:main
