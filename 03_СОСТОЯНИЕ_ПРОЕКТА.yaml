project:
  name: ARDU
  description: "Круглая потолочная лампа со светомузыкой, микрофоном, будильником-рассветом и управлением через мобильное приложение"
  initialized: "2026-09-05"
  phase: architecture_initialization
  repository: "dronrome1245/ARDU"

constraints:
  new_hardware_purchase: false
  target_control: wifi_mobile_app
  audio_source: room_microphone
  led_type: WS2812B

hardware:
  arduino_nano:
    available: true
    proposed_role: realtime_controller
  esp8266:
    available: true
    marking: "ESP8266MOD AI-THINKER"
    proposed_role: wifi_gateway
    bluetooth_builtin: false
    power_verified: false
    flashing_method_verified: false
  max9814:
    available_in_project_materials: true
    role: microphone_with_agc
  ds3231:
    present_in_previous_design: true
    role: rtc_for_dawn_alarm
  hc05:
    present_in_previous_design: true
    role: temporary_bluetooth_fallback
  ws2812b:
    present_in_project_materials: true
    led_count_confirmed: false

architecture:
  command_path:
    - mobile_app
    - wifi
    - esp8266
    - uart
    - arduino_nano
    - led_audio_rtc
  preserve_existing_command_semantics: true
  migrate_audio_processing_to_esp8266_now: false

progress:
  repository_initialized_percent: 100
  architecture_documented_percent: 80
  wifi_hardware_verified_percent: 0
  uart_gateway_verified_percent: 0
  mobile_app_wifi_migration_percent: 0
  integrated_lamp_test_percent: 0

current_focus: "Проверка питания, прошивки и UART для имеющегося ESP8266MOD"

critical_blockers:
  - "Не подтверждено питание конкретной переходной платы ESP8266MOD"
  - "Не подтвержден способ прошивки ESP8266MOD"
  - "Есть конфликт старой распиновки A0/A3 и D6/D12"
  - "Не зафиксировано фактическое количество светодиодов круглой лампы"
  - "Не выбран режим Wi-Fi: SoftAP или подключение к существующей сети"
  - "Не подтвержден фактический блок питания WS2812B"

next_milestone:
  name: wifi_uart_proof_of_concept
  success_condition: "ESP8266 принимает команду по Wi-Fi и передает ее Nano по UART с ответом обратно"
