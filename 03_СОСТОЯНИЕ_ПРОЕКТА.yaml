project:
  name: ARDU
  description: "Два синхронных круглых потолочных WS2812B-светильника со светомузыкой, рассветом и Wi-Fi приложением"
  initialized: "2026-09-05"
  phase: app_model_done_power_bench_next
  repository: "dronrome1245/ARDU"

constraints:
  minimize_new_hardware_purchase: true
  inventory_closed: true
  main_room_light_separate: true
  round_fixture_white_light_used: false
  second_wall_switch_hard_power_cut: true
  alarm_requires_wall_switch_on: true
  target_control: wifi_mobile_app
  network_cloud_required: false

hardware:
  arduino_nano:
    available: true
    role: realtime_controller
  esp8266:
    available: true
    role: wifi_gateway
    adapter_vcc_volts: 3.3
    five_volts_on_vcc_forbidden: true
    flashing_method_verified: false
  max9814:
    available: true
    role: primary_microphone
  max4466:
    available: true
    role: reserve_microphone
  ds3231:
    available: true
    battery: CR2032
    charging_path_present: true
    required_modification: "remove resistor 201 before normal 5V use"
  ws2812b:
    density_led_per_m_estimate: 60.7
    ring_path_cm: 71.5
    target_led_per_fixture: 43
    fixture_count: 2
    target_total_led: 86
    total_strip_length_required_m: 1.43
    total_strip_length_available_m: 5.0
    total_strip_length_available_confirmed: true
  psu:
    model: S-30-5
    output_nominal: "5V 6A 30W"
    output_measured: false
    led_current_limit_target_ma: 4500
  regulator_3v3:
    model: YP-8 AMS1117-3.3
    output_measured: false
    wifi_load_tested: false
  capacitor_100uf:
    available: true
    voltage_rating_v: 10
  capacitor_1000uf:
    available_probable: true
    voltage_rating_confirmed: false
    count_confirmed: false
  capacitor_disc_103:
    available: true
    capacitance_nf: 10
  data_resistor_330:
    required_count: 2
    confirmed_available: false

architecture:
  wifi_primary_mode: station
  wifi_fallback_mode: softap
  network_api_v1: http_local
  mobile_app: rewrite_from_scratch
  legacy_app_analyzed: true
  legacy_app_name: LumpV3.1
  legacy_protocol_external_compatibility_required: false
  one_controller_for_both_fixtures: true
  separate_data_lines: true
  nano_pinout:
    esp_uart_rx: D0
    esp_uart_tx: D1
    ws2812_a: D6
    ws2812_b: D7
    max9814_out: A0
    ds3231_sda: A4
    ds3231_scl: A5

modes:
  music:
    - M01_vu_gradient
    - M02_vu_rainbow
    - M03_5_band
    - M04_3_band
    - M05_1_band_submodes
    - M06_strobe_manual_only
    - M08_running_frequencies
    - M09_spectrum_analyzer
  ambient:
    - F01_static_color
    - F02_smooth_color_change
    - F03_running_rainbow
  night:
    base: "color + saturation + brightness"
    schedule: later_stage
  alarm:
    autonomous: true
    rtc: DS3231
    parameters:
      - enabled
      - time
      - fade_minutes
      - max_brightness
      - start_color
      - end_color
      - stop_active_dawn

power_topology:
  mains_path: "second switch -> one S-30-5"
  low_voltage_branches: 2
  desired_rule: "230V only up to PSU; 5V/GND/DATA to fixture bodies where possible"
  final_wiring_route_confirmed: false
  psu_location_confirmed: false

progress:
  hardware_inventory_percent: 100
  functional_architecture_percent: 100
  legacy_app_analysis_percent: 100
  app_functional_model_percent: 90
  dual_fixture_geometry_percent: 80
  mains_low_voltage_layout_percent: 30
  electrical_measurements_percent: 0
  wifi_hardware_verified_percent: 0
  uart_gateway_verified_percent: 0
  mobile_app_implementation_percent: 0

current_focus: "Verify/compile nano_m04, then upload and hardware-test M04 three-stripe frequency mode on one D6 ring"

critical_blockers:
  - "Distance and wiring topology between two ceiling fixtures not known"
  - "Safe physical location for common S-30-5 not confirmed"
  - "S-30-5 output not measured"
  - "YP-8 output and Wi-Fi load behavior not measured"
  - "ESP8266 flashing method not yet proven"
  - "1000uF count/rating not fully confirmed"
  - "330 ohm data resistors not confirmed in inventory"

next_milestone:
  name: power_bom_and_wifi_bench_ready
  success_condition: "Power measurements passed, ceiling low-voltage layout and PSU placement fixed, final BOM approved, ESP8266 flashed and UART PING/PONG with Nano works"

